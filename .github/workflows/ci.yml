name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run Ruff Lint and Format check
        run: |
          ruff check .
          ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db_type: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: depthub
          POSTGRES_PASSWORD: depthub_password
          POSTGRES_DB: depthub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium
      - name: Run tests (SQLite)
        if: matrix.db_type == 'sqlite'
        env:
          ENV: test
          SECRET_KEY: test-secret-key-32bytes-long-for-testing-only
          DATABASE_URL: sqlite:///./ci_test.db
        run: |
          alembic upgrade head
          pytest -v
      - name: Run tests (PostgreSQL)
        if: matrix.db_type == 'postgres'
        env:
          ENV: test
          SECRET_KEY: test-secret-key-32bytes-long-for-testing-only
          DATABASE_URL: postgresql+psycopg://depthub:depthub_password@localhost:5432/depthub_test
          POSTGRES_TEST_URL: postgresql+psycopg://depthub:depthub_password@localhost:5432/depthub_test
        run: |
          alembic upgrade head
          pytest -v
