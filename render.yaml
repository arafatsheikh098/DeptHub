services:
  - type: web
    name: depthub
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: depthub-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TIMEZONE
        value: Asia/Dhaka
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: TERM_START
        value: "2026-01-01"
      - key: TERM_END
        value: "2026-06-30"

databases:
  - name: depthub-db
    plan: free
    region: oregon
    databaseName: depthub
    user: depthub
